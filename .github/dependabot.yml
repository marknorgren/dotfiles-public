# Workflow actions are pinned to commit SHAs so a repointed tag cannot change
# what CI runs. Pinning also removes the automatic updates a moving tag gave
# us, so Dependabot proposes the bumps instead. It rewrites both the SHA and
# the trailing version comment.
version: 2

updates:
  - package-ecosystem: "github-actions"
    # "/" covers .github/workflows, not a directory named "/".
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
