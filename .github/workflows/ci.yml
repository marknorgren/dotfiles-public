# CI for dotfiles-public: runs the repo's own quality gates.
#
#   just check       -> deno fmt --check, deno lint, deno check (typecheck),
#                       deno test, plus bash -n + shellcheck on the shell
#                       entry points (install, bin/devcontainer-stack,
#                       scripts/container-check.sh, .devcontainer/post-create.sh,
#                       .macos) — same command contributors run locally.
#   gitleaks action  -> CI counterpart of `just public-scan` (secret scan).
#
# Third-party actions are pinned to a commit SHA, not a moving tag: a tag can be
# repointed at new code by whoever owns the action. The trailing comment records
# the version each SHA corresponded to. Bump with the SHA and the comment
# together.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: just check (deno + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          # Pinned to the 2.8 line to match the local toolchain — deno fmt
          # output changes between minor versions, and the fmt --check gate
          # must agree with what contributors run locally.
          deno-version: "~2.8"

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      # zsh and shfmt are not on the runner image. repo_test invokes the
      # zsh-based bin/verify command. Install shfmt from its pinned release and
      # verify it rather than adding another third-party action to trust.
      - name: Install shell tooling
        env:
          SHFMT_VERSION: v3.14.0
          SHFMT_SHA256: fe42021c7272ef2d67ea36cbc3031683c625d0badec733ef3a57b567246a0b66
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/shfmt_${SHFMT_VERSION}_linux_amd64"
          echo "${SHFMT_SHA256}  /tmp/shfmt" | sha256sum --check --strict
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shfmt --version

      # shellcheck is preinstalled on ubuntu-latest runners; `just check`
      # runs `deno task check` (fmt, lint, typecheck, test) and the
      # shell-check recipe.
      - name: Run repo quality gate
        run: just check

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so gitleaks can scan commits, not just the checkout.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
